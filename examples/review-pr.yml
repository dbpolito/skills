name: Review PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REVIEW_LOGIN: github-actions[bot]
      REVIEW_MODEL: ${{ vars.OPENCODE_MODEL }}
      REVIEW_VARIANT: ${{ vars.OPENCODE_VARIANT || 'default' }}
      REVIEW_AGENT: build
      REVIEW_VERSION: opencode-ci@0.1.10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install review skill
        run: npx --yes skills add dbpolito/skills --skill review-pr -g -a opencode -y

      - name: Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          : "${REVIEW_MODEL:?Set the OPENCODE_MODEL repository variable}"
          model="$REVIEW_MODEL"
          if [ "$REVIEW_VARIANT" != default ]; then
            model="$model#$REVIEW_VARIANT"
          fi
          npx --yes opencode-ci@0.1.10 run --auto --thinking \
            --agent "$REVIEW_AGENT" --model "$model" --timeout 2700 \
            --title "review-pr $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            'Use @review-pr to review and publish findings for the PR supplied in the environment.'
